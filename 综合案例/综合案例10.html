<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
*{
    margin: 0px;
    padding: 0px;
    box-sizing: border-box;
}
h4{
    font-weight: normal;
    font-size: 20px;
    line-height: 40px;
}
p{
    font-size: 14px;
}
img{
    width: 88px;
}
.solution{
    display: flex;
    flex-wrap: wrap;
    justify-content: space-around;
    align-items: center;
    align-content: space-evenly;

    width: 1200px;
    height: 400px;
    border: 1px solid #333;
    border-radius: 5px;
    margin: 50px auto;
}
.solution .box{
    display: flex;
    

    width: 500px;
    height: 88px;
    padding-left: 20px;
    /* border: 1px solid black; */
    
}
.solution .box .text{
    display: flex;
    flex-direction: column;
    /* justify-content: center; */

    padding-left: 10px;
}
</style>
<body>
    <div class="solution">
        <div class="box">
            <img src="../images/day6/1.svg" alt="">
            <div class="text">
                <h4>一键发布多端</h4>
                <p>发布视频到抖音短视频、西瓜视频及今日头条</p>
            </div>
        </div>
        <div class="box">
            <img src="../images/day6/2.svg" alt="">
            <div class="text">
                <h4>管理视频内容</h4>
                <p>支持修改已发布稿件状态和实时查询视频审核状态</p>
            </div>
        </div>
        <div class="box">
            <img src="../images/day6/3.svg" alt="">
            <div class="text">
                <h4>发布携带组件</h4>
                <p>支持分享内容携带小程序、地理位置信息等组件，扩展内容及突出地域性</p>
            </div>
        </div>
        <div class="box">
            <img src="../images/day6/4.svg" alt="">
            <div class="text">
                <h4>数据评估分析</h4>
                <p>获取视频在对应产品内的数据表现、获取抖音热点，及时进行表现评估</p>
            </div>
        </div>
    </div>
</body>
</html>
